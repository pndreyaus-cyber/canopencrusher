[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-centroid-lib"
version = "0.1.0"
description = "YOLO-based white object centroid detection library"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI ChatGPT" }
]
dependencies = [
  "numpy>=2.1",
  "opencv-python>=4.10",
  "ultralytics>=8.3"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vision_centroid_lib*"]
